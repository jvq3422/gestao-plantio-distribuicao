<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-recreio.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recreio Morro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1c120c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Recreio do Morro • Chapada Diamantina - Bahia | Gestão Agronômica & Distribuição</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #1c120c;
        background-color: #faf8f4;
      }
      .font-serif, .font-serif-brand, .font-playfair {
        font-family: 'Playfair Display', Georgia, serif !important;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
    <script>
      // Capturador global de erros para prevenção de tela branca
      window.addEventListener('error', function(event) {
        console.error('[App Crash]', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var box = document.getElementById('fatal-error-fallback');
          if (!box) {
            box = document.createElement('div');
            box.id = 'fatal-error-fallback';
            box.style.cssText = 'padding:24px;background:#fff;color:#991b1b;border:2px solid #f87171;border-radius:12px;font-family:sans-serif;margin:30px auto;max-width:600px;box-shadow:0 10px 25px rgba(0,0,0,0.1);';
            box.innerHTML = '<h3 style="margin-top:0;color:#991b1b;">Diagnóstico de Inicialização</h3>' +
              '<p style="color:#374151;font-size:14px;">Ocorreu uma exceção ao carregar os módulos:</p>' +
              '<pre style="background:#fef2f2;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;color:#b91c1c;">' +
              (event.message || event.error?.message || 'Erro desconhecido') + '\n' +
              (event.filename ? ('Origem: ' + event.filename + ':' + event.lineno) : '') +
              '</pre>' +
              '<div style="margin-top:16px;display:flex;gap:12px;">' +
                '<button onclick="location.reload()" style="padding:10px 18px;background:#964f0b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Recarregar</button>' +
                '<button onclick="localStorage.clear();location.reload()" style="padding:10px 18px;background:#4b5563;color:#fff;border:none;border-radius:8px;cursor:pointer;">Limpar Dados Locais</button>' +
              '</div>';
            document.body.appendChild(box);
          }
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('[Unhandled Rejection]', event.reason);
      });
    </script>
  </head>
  <body class="bg-[#faf8f4] text-stone-900 antialiased selection:bg-recreio-gold-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Só registra Service Worker na Web via HTTP/HTTPS real (não no Desktop/Tauri)
      if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__ && location.protocol.indexOf('http') === 0 && location.hostname !== 'tauri.localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
